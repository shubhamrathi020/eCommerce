# Run the whole shop locally:  docker compose up --build
#   Storefront: http://localhost:4000      Admin console: http://localhost:4001      API: http://localhost:3333
# Backend services (queue, search) are added here as they are built.
name: shop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: shop-api:local
    ports:
      - "3333:3333"
    environment:
      PORT: "3333"
      NODE_ENV: production
      DATABASE_URL: "postgresql://ecommerce:ecommerce@postgres:5432/ecommerce?schema=public"
      REDIS_URL: "redis://redis:6379"
      # Dev-only defaults so the stack runs out of the box; override for anything beyond local use.
      JWT_ACCESS_SECRET: "dev-only-access-secret-change-me-please-32chars"
      JWT_REFRESH_SECRET: "dev-only-refresh-secret-change-me-please-32chr"
      CORS_ORIGINS: "http://localhost:4000,http://localhost:4001"
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    image: shop-storefront:local
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      # Hosts the server may answer to (Angular blocks unknown Host headers).
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: shop-admin:local
    ports:
      - "4001:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
