# Run the whole shop locally:  docker compose up --build
#   Storefront: http://localhost:4000      Admin console: http://localhost:4001      API: http://localhost:3333
#   Meilisearch: http://localhost:7700     Mongo: localhost:27017     RabbitMQ: http://localhost:15672
name: shop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Catalog store (BRD 20, CS-01): flexible product/category attributes, as decided in BRD 19's F4.
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Message broker (BRD 23, MQ-01): the outbox relay publishes here; notification/scheduler consumers
  # read from here. Management UI (guest/guest by default) at http://localhost:15672.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Search engine (BRD 20, CS-03): typo-tolerant, faceted product search.
  meilisearch:
    image: getmeili/meilisearch:v1.54
    ports:
      - "7700:7700"
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: "development"
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot: loads the 252 seeded products (+ categories, brands, collections, reviews) into Mongo and
  # builds the Meilisearch index, then exits. The API waits for it. Safe to re-run (every write is an
  # upsert/replace), so it also runs on every `docker compose up`, not only the first time.
  catalog-seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: shop-api-migrate:local
    entrypoint: ["node", "--import", "tsx", "apps/api/scripts/seed-catalog.ts"]
    environment:
      MONGODB_URL: "mongodb://mongo:27017"
      MEILI_URL: "http://meilisearch:7700"
    depends_on:
      mongo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: "no"

  # One-shot: applies database migrations and seeds the demo accounts, then exits. The API waits for it.
  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: shop-api-migrate:local
    environment:
      DATABASE_URL: "postgresql://ecommerce:ecommerce@postgres:5432/ecommerce?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: shop-api:local
    ports:
      - "3333:3333"
    environment:
      PORT: "3333"
      NODE_ENV: production
      DATABASE_URL: "postgresql://ecommerce:ecommerce@postgres:5432/ecommerce?schema=public"
      REDIS_URL: "redis://redis:6379"
      MONGODB_URL: "mongodb://mongo:27017"
      MEILI_URL: "http://meilisearch:7700"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      # Dev-only defaults so the stack runs out of the box; override for anything beyond local use.
      JWT_ACCESS_SECRET: "dev-only-access-secret-change-me-please-32chars"
      JWT_REFRESH_SECRET: "dev-only-refresh-secret-change-me-please-32chr"
      CORS_ORIGINS: "http://localhost:4000,http://localhost:4001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      catalog-seed:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    image: shop-storefront:local
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      # Hosts the server may answer to (Angular blocks unknown Host headers).
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: shop-admin:local
    ports:
      - "4001:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  mongo-data:
  meili-data:
