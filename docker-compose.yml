# Run the storefront and admin console as production images:  docker compose up --build
#   Storefront: http://localhost:4000      Admin console: http://localhost:4001
# They use built-in mock data unless the apps are configured for the real backend. The backend, its databases and
# the monitoring stack are in the separate eCommerce-api repository (its docker-compose.yml).
name: shop-web

services:
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      additional_contexts:
        contracts_src: ../eCommerce-contracts
    image: shop-storefront:local
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      # Hosts the server may answer to (Angular blocks unknown Host headers).
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      additional_contexts:
        contracts_src: ../eCommerce-contracts
    image: shop-admin:local
    ports:
      - "4001:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
