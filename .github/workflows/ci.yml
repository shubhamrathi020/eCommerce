name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the "Run workflow" button on the Actions tab

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Lint, unit test and build everything
        run: pnpm exec nx run-many -t lint test build --parallel=3

      - name: Dependency audit (high severity and above)
        run: pnpm audit --audit-level high --prod
        continue-on-error: true # reported, not blocking, until a triage process exists

      - name: Upload production builds
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/apps
          retention-days: 3

  e2e:
    name: Smoke tests (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The config runs six projects (Chromium, Firefox, WebKit, a phone and a tablet each), so every engine is needed.
      # Installing only Chromium made the Firefox and WebKit projects fail with "executable doesn't exist".
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # No --project flag: nx does not pass it on to Playwright, so it would only look like a Chromium-only run.
      - name: Run smoke tests against the dev servers
        run: pnpm exec nx e2e storefront-e2e
        env:
          CI: "true"

      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright
          include-hidden-files: true # the folder name starts with a dot, which upload-artifact skips by default
          retention-days: 3

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build storefront image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: false
          tags: shop-storefront:ci
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: shop-admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
