name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Lint, unit test and build everything
        run: pnpm exec nx run-many -t lint test build --parallel=3

      - name: Dependency audit (high severity and above)
        run: pnpm audit --audit-level high --prod
        continue-on-error: true # reported, not blocking, until a triage process exists

      - name: Upload production builds
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/apps
          retention-days: 3

  e2e:
    name: Smoke tests (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests against the dev servers
        run: pnpm exec nx e2e storefront-e2e --project=chromium
        env:
          CI: "true"

      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 3

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build storefront image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: false
          tags: shop-storefront:ci
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: shop-admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          load: true # kept locally so the scan step below can read it
          tags: shop-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Image scanning (BRD 25, K8-04). Fails the job on a fixable CRITICAL finding; HIGH is reported but not
      # blocking yet, same "reported before enforced" posture as the dependency audit above.
      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: shop-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Validate Kubernetes manifests render
        run: |
          # kustomize's secretGenerator reads real (gitignored) env files; CI has only the committed
          # .example templates, whose dev-only values are fine for a render check.
          for f in deploy/k8s/base/secrets/*.env.example deploy/k8s/data-tier/secrets/*.env.example; do cp "$f" "${f%.example}"; done
          curl -sSL -o kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          chmod +x kubectl
          ./kubectl kustomize deploy/k8s/base > /dev/null
          ./kubectl kustomize deploy/k8s/data-tier > /dev/null
